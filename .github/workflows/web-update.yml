name: Spiel-Update veröffentlichen
# Das Spiel bleibt in www/game.html; veröffentlichte Versionen liegen in web/ und update.json.
on:
  push:
    branches: [main]
    paths: ['www/game.html']
    tags: ['web-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Spielversion, z. B. 1.0.2 (höher als die letzte)'
        required: true
      notes:
        description: 'Kurze Notiz für das Update (optional)'
        required: false
permissions:
  contents: write
concurrency:
  group: update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Version bestimmen
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF#refs/heads/}" = "main" ] && [ -z "$INPUT_VERSION" ]; then
            V="$(python3 -c 'import json; from pathlib import Path; m=json.loads(Path("update.json").read_text()); v=(m.get("web") or {}).get("version", "1.0.0"); x=list(map(int,v.split("."))); print(f"{x[0]}.{x[1]}.{x[2]+1}")')"
          else
            V="${INPUT_VERSION:-$REF_NAME}"
            V="${V#web-v}"; V="${V#v}"
          fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Ungültige Version: $V" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript auf Syntaxfehler prüfen
        run: |
          python3 -c 'from pathlib import Path; import re; s=Path("www/game.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m,"Spielskript fehlt"; Path("/tmp/colonia-game-check.js").write_text(m.group(1))'
          node --check /tmp/colonia-game-check.js
      - name: Spielversion setzen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python3 scripts/stamp_web_version.py "$VERSION"
      - name: Aktuellen öffentlichen Kanal aus main holen
        run: |
          git fetch origin main
          git worktree add "$RUNNER_TEMP/channel" origin/main
      - name: Update-Dateien erzeugen
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          python3 scripts/publish_update.py --channel "$RUNNER_TEMP/channel" \
            --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --game www/game.html --notes "$NOTES"
      - name: Update veröffentlichen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/channel"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- update.json web/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Publish web update v$VERSION [skip ci]"
          git push origin HEAD:main
          echo "Spiel-Update v$VERSION veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
