name: Android Test-APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Stadt 2.0 JavaScript and compatibility hooks
        run: node tests/city2-smoke.mjs
      - run: npm install --no-audit --no-fund
      - name: Build offline PixiJS renderer
        run: npm run build:pixi21
      - name: Check PixiJS integration
        run: node tests/pixi21-smoke.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: COLONIA-XANTEN-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
