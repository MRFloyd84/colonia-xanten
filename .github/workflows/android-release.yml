name: Android Release-APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: update-channel
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Spielversion setzen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: python3 scripts/stamp_web_version.py "$APP_VERSION"

      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Setze Versionsnummer
        env:
          APP_VERSION: ${{ github.ref_name }}
          BUILD_CODE: ${{ github.run_number }}
        run: python3 scripts/set_android_version.py
      - name: Signaturschlüssel aus Repository-Secrets bereitstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || (echo 'Keystore fehlt' >&2; exit 1)
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/colonia-release.jks"
      - name: Signierte Release APK erstellen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/colonia-release.jks
        run: |
          python3 scripts/configure_signing.py
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Signaturdatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/colonia-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: COLONIA-XANTEN-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: GitHub Release mit APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/*.apk --title "COLONIA XANTEN $GITHUB_REF_NAME" --generate-notes
      # Öffentlicher Update-Kanal: APK + update.json, damit installierte Apps das Update finden.
      - name: APK im öffentlichen Update-Repo veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'MRFloyd84/colonia-xanten-releases' }}
          BUILD_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::warning::Secret RELEASES_TOKEN fehlt – APK wurde nicht im Update-Kanal veröffentlicht."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APK="$RUNNER_TEMP/COLONIA-XANTEN-$VERSION.apk"
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -n1)" "$APK"
          GH_TOKEN="$RELEASES_TOKEN" gh release create "v$VERSION" "$APK" --repo "$RELEASES_REPO" --title "COLONIA XANTEN $VERSION" --notes "App-Version $VERSION (Build $BUILD_CODE)"
          git clone "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" "$RUNNER_TEMP/channel"
          python3 scripts/publish_update.py --channel "$RUNNER_TEMP/channel" --repo "$RELEASES_REPO" --version "$VERSION" --game www/game.html \
            --apk-version "$VERSION" --apk-code "$BUILD_CODE" \
            --apk-url "https://github.com/$RELEASES_REPO/releases/download/v$VERSION/COLONIA-XANTEN-$VERSION.apk" \
            --notes "Neue App-Version $VERSION"
          cd "$RUNNER_TEMP/channel"
          git config user.name "colonia-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "App v$VERSION (Build $BUILD_CODE)"
          git push origin HEAD:main
