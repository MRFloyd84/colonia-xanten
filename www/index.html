<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171c19">
  <title>COLONIA XANTEN</title>
  <style>
    html,body{margin:0;height:100%;background:#171c19;color:#eee8d9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;box-sizing:border-box}
    #boot b{font-family:Georgia,serif;font-size:26px;letter-spacing:1.5px;color:#f5e9d0;font-weight:normal}
    #boot small{color:#a0a79b;letter-spacing:1.5px;font-size:11px}
    #boot p{color:#e8c9a8;font-size:13px;max-width:320px;line-height:1.5}
  </style>
</head>
<body>
<div id="boot"><b>COLONIA XANTEN</b><small>WIRD GELADEN …</small></div>
<script>
/*
 * COLONIA XANTEN · Start-Hülle mit Update-Funktion
 *
 * Diese Datei steckt fest in der APK und ändert sich nur mit einer neuen APK.
 * Das eigentliche Spiel liegt in game.html. Beim Start passiert Folgendes:
 *  1. Die mitgelieferte game.html wird gelesen.
 *  2. Liegt ein heruntergeladenes, neueres Spiel-Update vor, wird stattdessen dieses gestartet.
 *     Startet ein Update nicht sauber (kein Bestätigungssignal), fällt die App beim nächsten
 *     Start automatisch auf die zuletzt funktionierende Version zurück (älteres Update oder
 *     mitgelieferte Version) und lädt dieses Update nicht erneut.
 *  3. Im Hintergrund wird update.json aus dem öffentlichen Update-Repo geprüft:
 *     - neueres Spiel → herunterladen, SHA-256 prüfen, für den nächsten Start speichern
 *     - neuere APK → Hinweis mit Download-Knopf (Android verlangt eine Bestätigung)
 * Spielstände liegen im selben localStorage und bleiben bei Updates erhalten.
 */
(() => {
'use strict';
const SHELL_API = 1; // erhöhen, wenn Spiel-Updates neue Fähigkeiten der Hülle voraussetzen
const DEFAULT_UPDATE_URL = 'https://raw.githubusercontent.com/MRFloyd84/colonia-xanten/main/update.json';
const RECHECK_MS = 60 * 60 * 1000; // beim Zurückkehren in die App höchstens stündlich erneut prüfen
// Zwei Speicherplätze: „cand“ = frisch geladenes, noch nie gestartetes Update;
// „good“ = zuletzt erfolgreich gestartetes Update (Rückfallebene vor der mitgelieferten Version).
const K = {html:'cx-upd-html', meta:'cx-upd-meta', goodHtml:'cx-upd-good-html', goodMeta:'cx-upd-good-meta', trying:'cx-upd-trying', bad:'cx-upd-bad', last:'cx-upd-lastcheck', url:'cx-update-url'};
const SLOTS = {cand:[K.html,K.meta], good:[K.goodHtml,K.goodMeta]};

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const cap = () => window.Capacitor;
const isNative = () => !!cap()?.isNativePlatform?.();
const plugin = name => cap()?.Plugins?.[name];

function cmpVersion(a,b){
  const pa=String(a||'0').split('.').map(n=>parseInt(n,10)||0), pb=String(b||'0').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<3;i++){ if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)>(pb[i]||0)?1:-1; }
  return 0;
}
function metaOf(html,name,fallback){
  const m=String(html).match(new RegExp('<meta\\s+name="'+name+'"\\s+content="([^"]*)"','i'));
  return m?m[1]:fallback;
}
const versionOf = html => metaOf(html,'cx-web-version','0.0.0');
async function sha256(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

const status = {
  shellApi: SHELL_API, bundled: null, running: null, source: 'bundled',
  pending: null,        // heruntergeladenes Spiel-Update, aktiv ab dem nächsten Start
  apk: null,            // verfügbare neuere APK {version, versionCode, url, notes}
  needsApk: false,      // Spiel-Update existiert, braucht aber eine neuere App-Hülle
  appVersion: null, appBuild: null,
  lastCheck: +store.get(K.last) || 0,
  state: 'idle', error: null, fellBack: null
};
const listeners = new Set();
function notify(){ for(const fn of listeners){ try{ fn(snapshot()); }catch{} } renderBanner(); }
const snapshot = () => JSON.parse(JSON.stringify(status));

function readSlot(name){
  const [hk,mk] = SLOTS[name];
  try {
    const meta = JSON.parse(store.get(mk)||'null'), html = store.get(hk);
    if(meta && html && versionOf(html) === meta.version) return {version:meta.version, notes:meta.notes||'', html};
  } catch {}
  if(store.get(hk) || store.get(mk)) dropSlot(name);
  return null;
}
function dropSlot(name){ for(const k of SLOTS[name]) store.del(k); }
function writeSlot(name, version, notes, html){
  const [hk,mk] = SLOTS[name];
  store.del(mk);
  if(!store.set(hk, html)) return false;
  return store.set(mk, JSON.stringify({version, notes, at:Date.now()}));
}

async function boot(){
  let bundled;
  try {
    const r = await fetch('game.html', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    bundled = await r.text();
  } catch(e) {
    document.getElementById('boot').innerHTML = '<b>COLONIA XANTEN</b><p>Das Spiel konnte nicht geladen werden ('+String(e.message||e)+'). Im Browser bitte über einen lokalen Webserver öffnen oder game.html direkt starten.</p>';
    return;
  }
  status.bundled = versionOf(bundled);

  let cand = readSlot('cand'), good = readSlot('good');
  const trying = store.get(K.trying);
  store.del(K.trying);
  if(trying){
    // Der letzte Start dieses Updates wurde nie bestätigt → verwerfen und nicht erneut laden.
    if(cand && cand.version === trying){ store.set(K.bad, trying); status.fellBack = trying; dropSlot('cand'); cand = null; }
    else if(good && good.version === trying){ store.set(K.bad, trying); status.fellBack = trying; dropSlot('good'); good = null; }
  }
  // Nach einem APK-Update kann die mitgelieferte Version gleich neu oder neuer sein.
  if(good && cmpVersion(good.version, status.bundled) <= 0){ dropSlot('good'); good = null; }
  if(cand && cmpVersion(cand.version, good ? good.version : status.bundled) <= 0){ dropSlot('cand'); cand = null; }

  const pick = cand || good;
  const html = pick ? pick.html : bundled;
  status.running = versionOf(html);
  status.source = pick ? 'update' : 'bundled';
  if(pick) store.set(K.trying, pick.version);

  window.ColoniaUpdate = api;
  window.__cxBooted = false;
  document.open(); document.write(html); document.close();

  // Bestätigung: Das Spiel setzt window.__cxBooted = true, wenn es vollständig gestartet ist.
  const t0 = Date.now();
  const confirmBoot = () => {
    if(window.__cxBooted){
      store.del(K.trying);
      if(cand){ if(writeSlot('good', cand.version, cand.notes, cand.html)) dropSlot('cand'); }
      afterBoot();
    }
    else if(Date.now() - t0 < 20000) setTimeout(confirmBoot, 400);
    // sonst: trying bleibt gesetzt → beim nächsten Start Rückfall auf die mitgelieferte Version
  };
  setTimeout(confirmBoot, 300);
}

function afterBoot(){
  if(status.fellBack) toastBanner(`Spiel-Update ${status.fellBack} ließ sich nicht starten und wurde verworfen.`);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && Date.now() - status.lastCheck > RECHECK_MS) check();
  });
  check();
}

let checking = null;
function check(){ if(!checking) checking = runCheck().finally(() => { checking = null; }); return checking; }

async function runCheck(){
  status.state = 'checking'; status.error = null; notify();
  try {
    if(isNative() && plugin('App')?.getInfo && !status.appBuild){
      try { const info = await plugin('App').getInfo(); status.appVersion = info.version; status.appBuild = String(info.build); } catch {}
    }
    const base = store.get(K.url) || DEFAULT_UPDATE_URL;
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 15000);
    let manifest;
    try {
      const r = await fetch(base + (base.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store', signal:ctl.signal});
      if(!r.ok) throw new Error('Update-Server antwortet mit HTTP ' + r.status);
      manifest = await r.json();
    } finally { clearTimeout(timer); }
    status.lastCheck = Date.now(); store.set(K.last, String(status.lastCheck));

    // Spiel-Update
    const w = manifest && manifest.web;
    status.needsApk = false;
    if(w && w.version && w.url && /^[0-9a-f]{64}$/.test(w.sha256 || '')){
      const newest = status.pending ? status.pending.version : status.running;
      const isNewer = cmpVersion(w.version, newest) > 0 && cmpVersion(w.version, status.bundled) > 0;
      if(isNewer && (+w.minShell || 1) > SHELL_API){
        status.needsApk = true;
      } else if(isNewer && store.get(K.bad) !== w.version){
        status.state = 'downloading'; notify();
        const r = await fetch(w.url, {cache:'no-store'});
        if(!r.ok) throw new Error('Download fehlgeschlagen (HTTP ' + r.status + ')');
        const html = await r.text();
        if(await sha256(html) !== w.sha256) throw new Error('Prüfsumme des Spiel-Updates stimmt nicht – Update verworfen');
        if(versionOf(html) !== w.version) throw new Error('Versionsangabe im Spiel-Update stimmt nicht');
        if(!writeSlot('cand', w.version, w.notes||'', html)){ dropSlot('cand'); throw new Error('Nicht genug Speicher für das Spiel-Update'); }
        status.pending = {version:w.version, notes:w.notes||''};
      }
    }

    // App-Update (nur in der Android-App)
    const a = manifest && manifest.apk;
    status.apk = null;
    if(a && a.url && a.versionCode && isNative() && status.appBuild && +a.versionCode > +status.appBuild){
      status.apk = {version:a.version, versionCode:+a.versionCode, url:a.url, notes:a.notes||''};
    }
    status.state = 'ok';
  } catch(e) {
    status.state = 'error';
    status.error = e && e.name === 'AbortError' ? 'Zeitüberschreitung – keine Verbindung?'
      : e instanceof TypeError ? 'Keine Verbindung zum Update-Server.'
      : String(e && e.message || e);
  }
  notify();
  return snapshot();
}

async function openApk(){
  if(!status.apk) return;
  const url = status.apk.url;
  try {
    if(plugin('Browser')?.open){ await plugin('Browser').open({url}); return; }
  } catch {}
  window.open(url, '_blank', 'noopener');
}

// ---- Hinweisleiste im Spiel ------------------------------------------------
const dismissed = new Set();
function ensureStyle(){
  if(document.getElementById('cx-upd-style')) return;
  const st = document.createElement('style'); st.id = 'cx-upd-style';
  st.textContent = '#cx-upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);z-index:60;width:min(94vw,460px);box-sizing:border-box;background:#263525f2;border:1px solid #c8ad71;border-radius:12px;padding:11px 12px;color:#f5e9d2;font:13px system-ui;box-shadow:0 8px 28px #0008;display:flex;gap:10px;align-items:center}#cx-upd span{flex:1;line-height:1.4}#cx-upd small{display:block;color:#c9c3ad;font-size:11px;margin-top:2px}#cx-upd button{font:600 12px system-ui;border-radius:8px;padding:9px 11px;border:1px solid #b9a377;background:#4b5140;color:#fff0d2;cursor:pointer}#cx-upd button.cx-later{background:transparent;border-color:#6c7560;color:#cfc8b2}';
  document.head.appendChild(st);
}
function bannerContent(){
  if(status.apk && !dismissed.has('apk'+status.apk.versionCode)) return {key:'apk'+status.apk.versionCode, text:`Neue App-Version ${status.apk.version} verfügbar`, sub:'Android fragt nach dem Download einmal nach „Installieren“.', action:'Herunterladen', run:openApk};
  if(status.pending && !dismissed.has('web'+status.pending.version)) return {key:'web'+status.pending.version, text:`Spiel-Update ${status.pending.version} ist bereit`, sub:status.pending.notes || 'Wird beim nächsten Start aktiv. Spielstand bleibt erhalten.', action:'Jetzt neu starten', run:() => location.reload()};
  if(status.needsApk && !dismissed.has('needsApk')) return {key:'needsApk', text:'Ein Spiel-Update braucht eine neuere App-Version', sub:'Bitte die neueste APK installieren.', action:null};
  return null;
}
function renderBanner(){
  if(!document.body || !window.__cxBooted) return;
  ensureStyle();
  let el = document.getElementById('cx-upd');
  const c = bannerContent();
  if(!c){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'cx-upd'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML = '';
  const span = document.createElement('span'); span.textContent = c.text;
  const sm = document.createElement('small'); sm.textContent = c.sub; span.appendChild(sm); el.appendChild(span);
  if(c.action){ const b = document.createElement('button'); b.type='button'; b.textContent = c.action; b.onclick = c.run; el.appendChild(b); }
  const later = document.createElement('button'); later.type='button'; later.className='cx-later'; later.textContent='Später'; later.onclick = () => { dismissed.add(c.key); renderBanner(); }; el.appendChild(later);
}
function toastBanner(text){
  if(!document.body) return; ensureStyle();
  const el = document.createElement('div'); el.id = 'cx-upd-toast'; el.setAttribute('role','status');
  el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:60;background:#46362cf0;border:1px solid #bf9960;border-radius:10px;padding:10px 14px;color:#f0dac1;font:12px system-ui;max-width:88vw;text-align:center';
  el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 6000);
}

const api = {
  status: snapshot,
  check,
  restart: () => location.reload(),
  openApk,
  onChange(fn){ listeners.add(fn); return () => listeners.delete(fn); }
};

boot();
})();
</script>
</body>
</html>
